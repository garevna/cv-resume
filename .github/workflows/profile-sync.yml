name: profile in sync

on:
  push:
    paths: ['README.md', 'RESUME.md', 'CV_UA.md', 'index.html', 'data/profile.json']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-profile.mjs --check
