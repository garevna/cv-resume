<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irina H. Fylyppova — Senior Frontend Developer</title>
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://garevna.github.io/cv-resume/">
    <meta property="og:title" content="Irina H. Fylyppova — Senior Frontend Developer">
    <meta property="og:description" content="Vue 3 and TypeScript, performance architecture with Web Workers and IndexedDB, 38 published npm packages. Interactive CV.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --accent-light: #ecf0f1;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --bg: #ffffff;
            --border: #ecf0f1;
            --success: #27ae60;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, #34495e 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .contacts {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.95em;
            opacity: 0.95;
        }

        .contacts a {
            color: #ecf0f1;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s;
        }

        .contacts a:hover {
            border-bottom-color: #3498db;
        }

        main {
            padding: 40px 30px;
        }

        section {
            margin-bottom: 35px;
        }

        h2 {
            font-size: 1.5em;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--accent);
            display: inline-block;
        }

        h3 {
            font-size: 1.1em;
            color: var(--primary);
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .job {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .job:last-child {
            border-bottom: none;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .job-title {
            font-weight: 600;
            font-size: 1.05em;
            color: var(--primary);
        }

        .job-meta {
            font-size: 0.9em;
            color: var(--text-light);
            font-style: italic;
        }

        .job-company {
            color: var(--accent);
            font-weight: 500;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .tech-tag {
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .skill-category {
            background: var(--accent-light);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .skill-category h4 {
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 0.95em;
            font-weight: 600;
        }

        .skill-category p {
            font-size: 0.9em;
            line-height: 1.5;
            color: var(--text);
        }

        ul, ol {
            margin-left: 20px;
            margin-top: 10px;
        }

        li {
            margin-bottom: 8px;
            color: var(--text);
            font-size: 0.95em;
        }

        .highlight {
            background: #fffacd;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .quote {
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            padding: 15px;
            margin: 15px 0;
            font-style: italic;
            color: var(--text-light);
        }

        .langs {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .lang-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-flag {
            font-size: 1.5em;
        }

        .links-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.3s, transform 0.2s;
            font-size: 0.9em;
        }

        .link-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        footer {
            background: #f8f9fa;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid var(--border);
            font-size: 0.85em;
            color: var(--text-light);
        }

        .print-notice,
        .callout {
            background: #d5f4e6;
            border: 1px solid #27ae60;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: var(--primary);
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                max-width: 100%;
            }
            .print-notice {
                display: none;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            main {
                padding: 25px 20px;
            }
            h2 {
                font-size: 1.3em;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Разметка, которую даёт markdown. Раньше карточки работ были
           расставлены руками — .job, .job-title, .job-company. Теперь их роль
           играют обычные заголовки, и правила ниже возвращают им тот же вид:
           место работы отделено линией, подзаголовки приглушены, название
           проекта выделено акцентом. */
        main h3 {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            font-size: 1.15em;
            color: var(--primary);
        }

        main section > h3:first-of-type {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        main h4 {
            margin: 20px 0 10px;
            color: var(--text-light);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        main p {
            margin-bottom: 12px;
        }

        main ul,
        main ol {
            margin: 0 0 16px 22px;
        }

        /* Абзац, который целиком состоит из жирного текста, — это название
           проекта внутри места работы. */
        main section > p > strong:only-child {
            color: var(--accent);
            font-size: 1.02em;
        }

        /* Подпись над рядом таблеток: в рукописной версии её не было, там
           роль заголовка играл h4 внутри карточки. */
        .tech-label {
            margin: 18px 0 8px;
            color: var(--text-light);
            font-size: 0.9em;
        }

        .tech-label strong {
            color: var(--primary);
        }

        .tech-tag code {
            background: none;
            padding: 0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Irina H. Fylyppova</h1>
            <p class="subtitle">Senior Frontend Developer</p>
            <div class="contacts">
                <span>📧 <!--p:email-->irina.h.fylyppova@gmail.com<!--/p--></span>
                <span>📍 <!--p:location.en-->Kharkiv, Ukraine<!--/p--></span>
                <span>🌐 <!--p:availability.en-->Remote only<!--/p--></span>
            </div>
            <div class="contacts" style="margin-top: 15px;">
                <a href="https://github.com/garevna" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/garevna/" target="_blank">LinkedIn</a>
                <a href="https://garevna.github.io/js-lessons/" target="_blank">JS Lessons</a>
            </div>
        </header>

        <main>
            <div class="print-notice">
                💡 <strong>Tip:</strong> Use Ctrl+P (or Cmd+P) to print or save as PDF
            </div>

<!--CONTENT-->

        </main>

        <footer>
            <p>© 2024 Irina H. Fylyppova. Last Updated: September 2024</p>
            <p>Available at: <a href="https://github.com/garevna/cv-resume" target="_blank" style="color: var(--accent); text-decoration: none;">github.com/garevna/cv-resume</a></p>
        </footer>
    </div>
</body>
</html>
