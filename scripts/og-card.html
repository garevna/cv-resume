<title>OG card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0B1413;
    color: #E5EDEB;
    font-family: "Archivo", Arial, sans-serif;
    padding: 68px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: #4FC7C1; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 19px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7F9895;
  }
  h1 {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 26px 0 22px;
    max-width: 15ch;
  }
  p.sub {
    font-size: 27px;
    line-height: 1.4;
    color: #B4C6C3;
    max-width: 34ch;
  }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .metrics { display: flex; gap: 52px; }
  .metric b {
    display: block;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #4FC7C1;
    line-height: 1;
  }
  .metric span {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7F9895;
    margin-top: 10px;
  }
  .who {
    font-family: "IBM Plex Mono", monospace;
    font-size: 17px;
    color: #7F9895;
    text-align: right;
    line-height: 1.7;
  }
  .who b { display: block; color: #E5EDEB; font-weight: 500; }
</style>

<div class="rule"></div>

<div>
  <p class="eyebrow">Frontend case study · 2020 – 2023</p>
  <h1>DGtek Provisioning Portal</h1>
  <p class="sub">A Web Worker data layer, client-side reporting and geospatial serviceability search for a fibre network operator.</p>
</div>

<div class="foot">
  <div class="metrics">
    <div class="metric"><b>14</b><span>repositories</span></div>
    <div class="metric"><b>~72k</b><span>lines</span></div>
    <div class="metric"><b>7</b><span>npm packages</span></div>
  </div>
  <p class="who"><b>Irina Fylyppova</b>Senior Frontend Developer</p>
</div>
